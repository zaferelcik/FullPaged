<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FullPaged</title>
<style>
  :root { --blue: #2160e4; --blue-dark: #1a4fc4; --ink: #1b2333; --muted: #66707f; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 300px; padding: 16px;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: #fff;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header img { width: 28px; height: 28px; border-radius: 7px; }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
  header .off { margin-left: auto; font-size: 10px; font-weight: 700; color: #0a7a43;
    background: #e5f6ec; border-radius: 99px; padding: 3px 8px; }
  #capture {
    width: 100%; padding: 11px 0; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--blue); color: #fff; font-size: 14px; font-weight: 600;
  }
  #capture:hover { background: var(--blue-dark); }
  #capture:disabled { background: #a9bfef; cursor: default; }
  #status { min-height: 20px; margin-top: 10px; font-size: 12px; color: var(--muted); text-align: center; }
  #status.error { color: #b3261e; text-align: left; }
  .bar { height: 4px; border-radius: 2px; background: #e8ecf3; margin-top: 8px; overflow: hidden; display: none; }
  .bar span { display: block; height: 100%; width: 0; background: var(--blue); transition: width .2s; }
  footer { display: flex; justify-content: space-between; margin-top: 14px; font-size: 12px; }
  footer a { color: var(--blue); text-decoration: none; cursor: pointer; }
  footer kbd { font: 11px monospace; background: #f0f3f8; border-radius: 4px; padding: 2px 5px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" />
    <h1>FullPaged</h1>
    <span class="off">OFFLINE</span>
  </header>
  <button id="capture">Capture full page</button>
  <div class="bar" id="bar"><span id="barfill"></span></div>
  <p id="status"></p>
  <footer>
    <a id="options">Settings</a>
    <span><kbd id="shortcut">Alt+Shift+S</kbd></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
